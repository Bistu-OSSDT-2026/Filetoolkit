[package]
name = "filetool"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
sha1 = "0.11.0"
sha2 = "0.11.0"
blake3 = "1.8.5"
md5 = "0.8.1"
