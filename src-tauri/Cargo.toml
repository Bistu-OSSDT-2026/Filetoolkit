[package]
name = "file-toolkit"
version = "0.1.0"
description = "一站式本地文件批量处理工具"
authors = ["FileToolkit"]
edition = "2021"

[lib]
name = "file_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
num_cpus = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
regex = "1"
tokio = { version = "1", features = ["process"] }
image = "0.25"
lopdf = "0.34"
zip = "2"
md5 = "0.8"
sha1 = "0.11"
sha2 = "0.11"
blake3 = "1"
walkdir = "2"
flate2 = "1"
tar = "0.4"
hex = "0.4"
